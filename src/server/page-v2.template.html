<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOS 工作台 V2</title>
<style>
:root{
  /* 语义色 */
  --bg:#FBF6EF;--surface:#FFFFFF;--surface-2:#F7F0E3;--surface-3:#F1E8D8;
  --ink:#241E17;--ink-2:#463D30;--ink-3:#5C5142;
  --line:#E2D4BA;--line-strong:#CCB78F;
  --accent:#E8563D;--accent-strong:#C9422C;--accent-soft:#FBE9E3;
  --success:#3E7D56;--success-soft:#E7F0EA;
  --warning:#A97B1F;--warning-soft:#F7EEDA;
  --danger:#B23A26;--danger-soft:#F9E4DE;
  --info:#2F6A94;--info-soft:#E4EEF5;
  --muted:#9A8D78;--muted-soft:#EFEAE0;
  /* 旧别名（兼容既有组件，语义同上） */
  --orange:var(--accent);--orange-strong:var(--accent-strong);--orange-soft:var(--accent-soft);
  --green:var(--success);--green-soft:var(--success-soft);
  --amber:var(--warning);--amber-soft:var(--warning-soft);
  --red:var(--danger);--red-soft:var(--danger-soft);
  --blue:var(--info);--blue-soft:var(--info-soft);
  --gray:var(--muted);--gray-soft:var(--muted-soft);
  /* 间距 */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  /* 圆角 */
  --r-xs:6px;--r-sm:8px;--r-md:10px;--r-lg:12px;--r-xl:16px;
  --radius:var(--r-lg);--radius-s:var(--r-md);
  /* 阴影层级 */
  --shadow-sm:0 1px 2px rgba(43,36,28,.05);
  --shadow-md:0 1px 3px rgba(43,36,28,.06),0 2px 10px rgba(43,36,28,.06);
  --shadow-lg:0 4px 16px rgba(43,36,28,.12),0 8px 32px rgba(43,36,28,.08);
  --shadow:var(--shadow-md);
  /* 字体层级 */
  --fs-title:20px;--fs-section:15px;--fs-card:14px;--fs-body:14px;--fs-meta:12px;--fs-tech:11.5px;
  --font:'PingFang SC',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
body.modal-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- layout ---- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;transition:transform .18s ease}
.brand{display:flex;align-items:center;gap:9px;height:64px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-size:15px;font-weight:700;line-height:1.2}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.06em;line-height:1}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--radius-s);color:var(--ink-2);font-size:13.5px;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--orange-soft);color:var(--orange-strong);font-weight:600}
.nav-item svg{flex:none;width:17px;height:17px}
.nav-preview-note{margin:10px 12px;padding:9px 11px;border-radius:9px;background:var(--gray-soft);color:var(--ink-3);font-size:11px;line-height:1.6;flex:none}
.main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;height:64px;background:rgba(251,246,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex:none}
.menu-toggle{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.topbar-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;min-width:150px;max-height:48px;line-height:1.2}
.topbar-title svg{width:22px;height:22px;flex:none}
.topbar-title span{white-space:nowrap}
.topbar-sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1;max-width:46vw}
.topbar-meta{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 12px;color:var(--ink-3);font-size:12px;white-space:nowrap;min-width:0;flex-shrink:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill-orange{background:var(--orange-soft);color:var(--orange-strong)}
.pill-green{background:var(--green-soft);color:var(--green)}
.pill-amber{background:var(--amber-soft);color:var(--amber)}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-blue{background:var(--blue-soft);color:var(--blue)}
.pill-gray{background:var(--gray-soft);color:var(--ink-3)}
.view{padding:28px 32px;max-width:1480px;width:100%;margin:0 auto}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 10px 40px rgba(43,36,28,.18)}
  .main{margin-left:0}
  .menu-toggle{display:inline-flex}
  .view{padding:20px 24px}
}
@media (max-width:767px){
  .topbar{padding:0 12px}
  .topbar-sub{display:none}
  .view{padding:14px 12px}
  .hide-sm{display:none}
  .topbar-meta{gap:8px}
}

/* ---- shared components ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--orange)}
.topic-section{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13.5px;line-height:1.7}
.topic-section h5{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.topic-section p{margin:0}
.topic-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.topic-risk{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;line-height:1.6}
.topic-risk b{font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
.stat-label{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.stat-label svg{width:13px;height:13px}
.stat-value{font-size:23px;font-weight:700;margin-top:3px;line-height:1.2}
.stat-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.stat.metric-card{transition:border-color .15s ease,background .15s ease}
.stat.metric-card:hover{border-color:var(--line-strong);background:var(--surface-2)}
.stat-value.amber-num{color:var(--warning)}
.stat-value.red-num{color:var(--danger)}
.stat-value.dim-num{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-gray{background:var(--gray-soft);color:var(--ink-3)}
.badge-orange{background:var(--orange-soft);color:var(--orange-strong)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}.dot-gray{background:var(--gray)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-size:11.5px;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row-click{cursor:pointer}
tr.row-click:hover{background:var(--surface-2)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-3);font-size:13px;background:var(--surface)}
.empty svg{width:30px;height:30px;margin:0 auto 8px;display:block;color:var(--ink-3);opacity:.55}
.review-notice{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:12px}
.review-notice svg{width:22px;height:22px;flex:none}
.review-notice .rn-text{flex:1;min-width:0}
.empty-note{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.7;max-width:520px;margin-left:auto;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
.btn-ghost{border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-retry{background:var(--orange);color:#fff;border:1px solid var(--orange)}
.btn-retry:hover{background:var(--orange-strong);border-color:var(--orange-strong)}
.btn-retry:disabled{opacity:.55;cursor:not-allowed}
.vis-note-box{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--danger-soft);border-left:3px solid var(--danger);font-size:12px;line-height:1.6;color:var(--ink-2);overflow-wrap:anywhere}
.vis-note-box .vn-label{font-weight:700;color:var(--danger)}
.vis-max-note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warning-soft);color:var(--warning);font-size:12px;line-height:1.6}
.vis-stub-note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--gray-soft);color:var(--ink-3);font-size:12px;line-height:1.6}
.retry-dialog-thumb{width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#1A140C;margin-bottom:10px}
.retry-sup-counter{font-size:11px;color:var(--ink-3);margin-top:3px;text-align:right}
.retry-sup-counter.over{color:var(--danger)}
.poll-hint{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-left:8px}
.poll-hint .dot{animation:pulse-dot 1.6s ease infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.25}}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-all}
.dim{color:var(--ink-3);font-size:12px}
/* ---- 统一组件 ---- */
.nav-group{padding:14px 12px 4px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.05em}
.nav-status-card{margin:8px 12px 12px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:11.5px;line-height:1.6;color:var(--ink-2)}
.nav-status-card b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-strong)}
.notice{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.notice svg{width:18px;height:18px;flex:none}
.notice .n-text{flex:1;min-width:0}
.notice.warn{background:var(--warning-soft);color:var(--warning)}
.notice.info{background:var(--info-soft);color:var(--info)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.notice.success{background:var(--success-soft);color:var(--success)}
.flowbar{display:flex;align-items:stretch;gap:4px;margin-bottom:16px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;max-width:100%}
.flow-step{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer;flex:none;transition:background .15s ease,border-color .15s ease}
.flow-step:hover{background:var(--surface-2);border-color:var(--line-strong)}
.flow-step.current{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.flow-step .fs-count{font-size:11px;color:var(--ink-3)}
.flow-step.current .fs-count{color:var(--accent-strong)}
.flow-step .fs-reason{font-size:11px;color:var(--danger);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk{display:inline-block;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk-shimmer 1.2s ease infinite}
@keyframes sk-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.copy-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink-3);background:var(--surface);cursor:pointer;vertical-align:middle}
.copy-btn:hover{background:var(--surface-2);color:var(--ink-2)}
.copy-btn.copied{color:var(--success);border-color:var(--success)}
.btn-approve{background:var(--success);color:#fff;border:1px solid var(--success)}
.btn-approve:hover{background:#356E4B;border-color:#356E4B}
.btn-approve:disabled{opacity:.55;cursor:not-allowed}
.btn-reject{background:var(--surface);color:var(--danger);border:1px solid var(--danger)}
.btn-reject:hover{background:var(--danger-soft)}
.btn-reject:disabled{opacity:.55;cursor:not-allowed}
.vis-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.vis-status{margin-top:auto;padding-top:10px;font-size:12px;color:var(--ink-2)}
.vis-status .dim{display:block;margin-top:2px}
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(30,22,12,.5)}
.modal-panel{position:relative;z-index:1;width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);animation:modal-in .15s ease}
@keyframes modal-in{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-size:14.5px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface-2)}
.modal-body{padding:16px 18px;overflow:auto;flex:1}
.modal-body .kv{font-size:12.5px;line-height:1.8}
.modal-body .kv b{color:var(--ink-3);font-weight:600;display:inline-block;min-width:76px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal-note{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.5;background:var(--surface);color:var(--ink)}
.modal-note:focus{outline:2px solid rgba(232,86,61,.2);border-color:var(--accent)}
.modal-warn{margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--warning-soft);color:var(--warning);font-size:12px;line-height:1.6}
.modal-err{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;line-height:1.6;display:none}
.modal-err.show{display:block}
.review-thumb{width:100%;max-height:150px;object-fit:contain;background:var(--surface-2);border-radius:8px;margin-bottom:10px;display:block}
.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:200;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .18s ease;pointer-events:none;max-width:92vw}
.toast.show{opacity:1}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.cluster-card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:11px 13px;margin-bottom:8px}
.cluster-card .cluster-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cluster-card .cluster-title{font-size:13px;font-weight:600}
.cluster-card .cluster-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.cluster-card .cluster-facts{font-size:12.5px;color:var(--ink-2);margin:6px 0 8px;line-height:1.6}
.totals-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.totals-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.totals-chip b{font-size:13px}
.table-scroll{overflow-x:auto}
.table-scroll table{min-width:560px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.sk{animation:none;background:var(--surface-2)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.grid-2>*,.grid-3>*{min-width:0}
.grid-2 .span2{grid-column:1/-1}
@media (max-width:900px){.grid-2 .todo-first{order:-1}}
/* ---- 今日总览驾驶舱网格 ---- */
.ov-dashboard{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:stretch}
.ov-dashboard>.card{min-width:0;display:flex;flex-direction:column}
.ov-dashboard>.card .card-head{flex:none}
.ov-metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:0}
.ov-metrics .metric-card{display:flex;flex-direction:column;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);text-align:left;cursor:pointer;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease}
.ov-metrics .metric-card:hover{border-color:var(--line-strong);background:var(--surface-2);box-shadow:var(--shadow-md)}
.ov-metrics .metric-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ov-metrics .metric-card .stat-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.ov-metrics .metric-card .stat-label svg{width:14px;height:14px}
.ov-metrics .metric-card .stat-value{font-size:26px;font-weight:700;line-height:1.15;margin-bottom:6px}
.ov-metrics .metric-card .stat-sub{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.ov-top5{grid-column:span 7}
.ov-flow{grid-column:span 5}
.ov-todo{grid-column:1/-1}
.ov-sources{grid-column:span 4}
.ov-jobs{grid-column:span 4}
.ov-alerts{grid-column:span 4}
.ov-dashboard .card-head{min-height:32px;align-items:center}
@media (max-width:1240px){.ov-top5,.ov-flow{grid-column:1/-1}.ov-todo{order:-1}}
@media (max-width:1024px){.ov-metrics{grid-template-columns:repeat(3,1fr)}.ov-sources,.ov-jobs,.ov-alerts{grid-column:span 6}}
@media (max-width:767px){.ov-metrics{grid-template-columns:repeat(2,1fr)}.ov-sources,.ov-jobs,.ov-alerts{grid-column:1/-1}}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
.creation-grid{display:grid;grid-template-columns:320px minmax(480px,1fr) 320px;grid-template-areas:"list preview fact";gap:14px;align-items:start}
.creation-grid .cg-list{grid-area:list;min-width:0}
.creation-grid .cg-preview{grid-area:preview;min-width:0}
.creation-grid .cg-fact{grid-area:fact;min-width:0}
.preview-frame{width:100%;max-width:720px;margin:0 auto;transition:max-width .15s ease}

details.tech{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2);margin-top:8px}

.todo-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}

.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

<script>

'use strict';
var $ = function(id){return document.getElementById(id);};
var esc = function(s){return String(s==null?'':s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#39;');};
function fmtISO(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d.getTime()))return esc(iso);var p=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function safeDecode(v){try{return decodeURIComponent(v);}catch(e){return v;}}
var ICONS={
  overview:['M3 3h7v7H3z','M14 3h7v7h-7z','M3 14h7v7H3z','M14 14h7v7h-7z'],
  intel:['M5 12a7 7 0 0 1 14 0','M8.5 12a3.5 3.5 0 0 1 7 0','M12 12l-3 9','M12 12l3 9'],
  topics:['M5 3v18','M5 3h12l-2 5 2 5H5'],
  creation:['M6 3h9l4 4v14H6z','M15 3v4h4','M9 12h6','M9 16h6'],
  review:['M9 3h6v4H9z','M6 5h2v4h8V5h2v16H6z','M9 13l2 2 4-4'],
  visual:['M4 4h16v16H4z','M4 15l5-5 4 4 3-3 4 4','M8.5 9.5a1.5 1.5 0 1 0 0-.01'],
  publish:['M3 11l18-7-7 18-2.5-7.5z','M21 4l-9.5 10.5'],
  growth:['M4 20V10','M10 20V4','M16 20v-7','M22 20H2'],
  system:['M12 2v3','M12 19v3','M2 12h3','M19 12h3','M4.9 4.9l2.1 2.1','M17 17l2.1 2.1','M19.1 4.9L17 7','M7 17l-2.1 2.1','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'],
  search:['M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14z','M21 21l-5-5'],
  close:['M6 6l12 12','M18 6L6 18'],
  chev:['M9 6l6 6-6 6'],
  ext:['M14 4h6v6','M20 4L10 14','M18 13v6H5V6h6'],
  alert:['M12 3l10 18H2z','M12 10v5','M12 18.5v.5'],
  clock:['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z','M12 7v5l3 2'],
  check:['M4 12l5 5L20 6'],
  filter:['M4 6h16','M7 12h10','M10 18h4'],
  doc:['M6 3h9l4 4v14H6z','M15 3v4h4'],
  image:['M4 4h16v16H4z','M4 15l5-5 4 4 3-3 4 4'],
  send:['M3 11l18-7-7 18-2.5-7.5z','M21 4l-9.5 10.5'],
  db:['M12 3c4 0 7 1.5 7 3.5S16 10 12 10 5 8.5 5 6.5 8 3 12 3z','M5 6.5V12c0 2 3 3.5 7 3.5s7-1.5 7-3.5V6.5','M5 12v5.5C5 19.5 8 21 12 21s7-1.5 7-3.5V12'],
  sun:['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z','M12 2v2','M12 20v2','M4 12H2','M22 12h-2','M5.6 5.6L4.2 4.2','M19.8 19.8l-1.4-1.4','M18.4 5.6l1.4-1.4','M4.2 19.8l1.4-1.4']
};
function icon(name){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||[]).map(function(d){return '<path d="'+d+'"/>';}).join('')+'</svg>';}
function badge(text,cls){return '<span class="badge '+(cls||'badge-gray')+'">'+esc(text)+'</span>';}
function empty(title,note,ic){return '<div class="empty">'+icon(ic||'doc')+'<div>'+esc(title)+'</div>'+(note?'<div class="empty-note">'+esc(note)+'</div>':'')+'</div>';}
function gradeBadge(g){var m={A:'badge-green',B:'badge-blue',C:'badge-amber',D:'badge-red'};return '<span class="badge '+(m[g]||'badge-gray')+'">'+esc(g)+'</span>';}
// 只读内容工厂流程：状态与数量全部来自现有数据，点击仅 hash 跳转
function flowStages(){
  var fact=D.factory||{};
  var srcs=((D.intel&&D.intel.health&&D.intel.health.sources)||[]);
  var health=(D.intel&&D.intel.health&&D.intel.health.overall)||'pending';
  var ed=(fact.editorial&&fact.editorial.cards)||[];
  var drafts=(fact.drafts)||[];
  var vis=(fact.visual&&fact.visual.batches)||[];
  var pendingTopics=ed.filter(function(c){return !c.decision||c.decision==='pending';}).length;
  var pendingDrafts=drafts.filter(function(p){return p.status==='waiting_approval';}).length;
  var pendingVisual=0;vis.forEach(function(b){(b.tasks||[]).forEach(function(t){if(t.state==='waiting_visual_approval')pendingVisual++;});});
  var anyVisualRejected=vis.some(function(b){return b.status==='rejected';});
  var pubReady=vis.some(function(b){return b.readiness&&b.readiness.readyForPublication;});
  return [
    {id:'intel',name:'情报',status:srcs.length?(health==='red'?'blocked':health==='green'?'done':'running'):'empty',count:srcs.length,reason:health==='red'?'信源异常':'',title:health==='red'?'情报源异常':'情报源 '+(health==='green'?'正常':'待接入')},
    {id:'topics',name:'选题',status:ed.length?(pendingTopics?'running':'done'):'empty',count:ed.length,reason:'',title:ed.length?(pendingTopics?'策划卡待审批':'策划已完成'):'暂无策划卡'},
    {id:'creation',name:'创作',status:drafts.length?(pendingDrafts?'running':'done'):'empty',count:drafts.length,reason:'',title:'草稿 '+(pendingDrafts?'待审批':'已完成')},
    {id:'review',name:'审核',status:(pendingTopics||pendingDrafts)?'running':((ed.length||drafts.length)?'done':'empty'),count:pendingTopics+pendingDrafts,reason:'',title:'待审 '+(pendingTopics+pendingDrafts)+' 项'},
    {id:'visual',name:'视觉',status:vis.length?(pendingVisual?'running':(anyVisualRejected?'blocked':'done')):'empty',count:pendingVisual,reason:anyVisualRejected?'有图片被驳回':'',title:'图片 '+(pendingVisual?'待审核':'已完成')},
    {id:'publish',name:'发布准备',status:pubReady?'done':(vis.length?'blocked':'empty'),count:vis.length,reason:vis.length&&!pubReady?'存在发布阻塞':'',title:pubReady?'发布就绪（人工操作）':'发布存在阻塞'}
  ];
}
function flowBar(current){
  var st=flowStages();
  var dot={done:'dot-green',running:'dot-blue',blocked:'dot-red',empty:'dot-gray'};
  var name={done:'已完成',running:'进行中',blocked:'阻塞',empty:'无任务'};
  return '<div class="flowbar" role="navigation" aria-label="内容生产流程">'+st.map(function(s){
    return '<button type="button" class="flow-step'+(s.id===current?' current':'')+'" data-flow="'+s.id+'" data-flow-status="'+s.status+'" title="'+esc(s.title||name[s.status])+'"><span class="fs-dot '+(dot[s.status]||'dot-gray')+'"></span>'+s.name+'<span class="fs-count">'+s.count+'</span>'+(s.reason?'<span class="fs-reason">'+esc(s.reason)+'</span>':'')+'</button>';
  }).join('')+'</div>';
}
function lineName(id){if(!id)return '—';var l=(D.lines||[]).filter(function(x){return x.id===id;})[0];return l?l.name:id;}
function fmtDate(v){if(!v)return '—';var s=String(v);if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);return esc(v);}

/* ============ data boot ============ */
var D = null;
function boot(){
  if(window._embeddedDailyData){D=window._embeddedDailyData;renderRouter();return;}
  // 无内嵌数据：显示加载态并经 GET /sparkos/data 兜底（只读）
  var view=$('view');
  view.innerHTML='<div class="empty">'+icon('clock')+'<div>正在加载工作台数据…</div></div>';
  fetch('/sparkos/data').then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.value){D=j.value;renderRouter();}
    else{renderFatal('数据端点返回异常：'+(j&&j.error&&j.error.message?j.error.message:'未知错误'));}
  }).catch(function(e){renderFatal('无法读取 /sparkos/data：'+String(e&&e.message||e));});
}
function renderFatal(msg){
  $('view').innerHTML='<div class="card"><div class="card-head"><div class="card-title">'+icon('alert')+'数据不可用</div></div><div class="empty">'+icon('alert')+'<div>'+esc(msg||'工作台数据缺失')+'</div><div class="empty-note">请刷新页面重试；若持续失败，请检查插件服务是否正常，或打开原版工作台 <a href="/sparkos/app">/sparkos/app</a> 对照。</div><div style="margin-top:12px"><button type="button" class="btn btn-ghost" onclick="location.reload()">重新加载</button></div></div></div>';

];
var state={view:'overview',filters:{review:{type:'all',urgency:'all',time:'all',q:''},intel:{q:''},creation:{packageId:null,platform:'wechat',previewMode:'desktop'}}};
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('?');
  var view=parts[0]||'overview';
  if(!VIEWS.some(function(v){return v.id===view;}))view='overview';
  var params={};
  if(parts[1])parts[1].split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)params[safeDecode(kv.slice(0,i))]=safeDecode(kv.slice(i+1));});
  return {view:view,params:params};
}
function setHashParams(params){
  var r=parseHash();
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  history.replaceState(null,'','#/'+r.view+(qs?'?'+qs:''));
}
function navigate(view){
  if(!VIEWS.some(function(v){return v.id===view;}))view='overview';
  if(view===state.view){renderView(view);return;}
  location.hash='#/'+view;
}
window.addEventListener('hashchange',renderRouter);
function renderRouter(){
  var r=parseHash();
  state.view=r.view;
  if(r.params.type)state.filters.review.type=r.params.type;
  if(r.params.urgency)state.filters.review.urgency=r.params.urgency;
  if(r.params.time)state.filters.review.time=r.params.time;
  if(r.params.q!=null)state.filters.review.q=r.params.q;
  if(r.params.pkg)state.filters.creation.packageId=r.params.pkg;
  if(r.params.pf)state.filters.creation.platform=r.params.pf;
  if(r.params.pv)state.filters.creation.previewMode=r.params.pv;
  renderView(r.view);
}
var NAV_GROUPS={content:'内容生产',ops:'运营'};
function renderView(view){
  state.view=view;
  var cur=VIEWS.filter(function(v){return v.id===view;})[0];
  var navHtml=[];
  Object.keys(NAV_GROUPS).forEach(function(gk){
    navHtml.push('<div class="nav-group">'+NAV_GROUPS[gk]+'</div>');
    VIEWS.filter(function(v){return v.group===gk;}).forEach(function(v){
      navHtml.push('<button type="button" class="nav-item'+(v.id===view?' active':'')+'" data-nav="'+v.id+'">'+icon(v.icon)+'<span>'+v.label+'</span></button>');
    });
  });
  $('nav').innerHTML=navHtml.join('');
  $('topbarTitle').innerHTML=icon(cur.icon)+'<span>'+cur.label+'</span>';
  $('topbarSub').textContent=cur.desc||'';
  $('topbarTime').textContent=D&&D.generatedAt?('数据 '+fmtISO(D.generatedAt)):'数据 —';
  var overall=(D&&D.intel&&D.intel.health&&D.intel.health.overall)||'pending';
  var overallName={green:'正常',red:'异常',pending:'待接入'}[overall]||overall;
  $('topbarHealth').textContent='信源 '+overallName;
  $('view').innerHTML=RENDER[view]();
  if(view==='review')applyReviewFilters();
  // M6.2：离开视觉页停止轮询；进入且存在 pipeline 任务时只读轮询
  if(view==='visual')startVisualPolling();
  else stopVisualPolling();
  $('view').scrollTop=0;window.scrollTo(0,0);
}

    var curA=null;(t.attempts||[]).forEach(function(a){if(Number(a.attemptNo)===Number(t.currentAttempt))curA=a;});

    if(t.state==='waiting_visual_approval')items.push({key:'visual',type:'图片',sev:0,time:curA?curA.createdAt:null,title:t.assetId,id:t.id,target:'visual',note:b.packageId+' · '+t.placement,risk:t.reviewNote||t.lastError||''});
    // M6.2：被驳回且可重试 → “待处理：需要重试”；生成中不算待审核
    if(t.state==='rejected'&&visualRetryInfo(t).eligible)items.push({key:'visual',type:'图片',sev:0,time:curA?curA.createdAt:null,title:t.assetId,id:t.id,target:'visual',note:'待处理：需要重试 · '+b.packageId+' · '+t.placement,risk:'按驳回意见创建重试任务'});
  });});
  (D.distillQueue||[]).forEach(function(e){items.push({key:'distill',type:'蒸馏',sev:2,time:null,title:e.file,id:e.file,target:'review',note:e.summary,risk:''});});
  return items;
}
function waitLabel(iso){
  if(!iso)return '—';
  var t=new Date(iso);if(isNaN(t.getTime()))return '—';
  var ms=Date.now()-t.getTime();if(ms<0)return '刚刚';
  var h=Math.floor(ms/3600000);var d=Math.floor(h/24);
  if(d>=1)return d+' 天前';if(h>=1)return h+' 小时前';return Math.max(1,Math.floor(ms/60000))+' 分钟前';
}

/* ============ visual ============ */
function currentAttempt(task){return (task.attempts||[]).filter(function(a){return Number(a.attemptNo)===Number(task.currentAttempt);})[0]||null;}
function dimsOf(a){return (a&&a.sourceWidth&&a.sourceHeight)?a.sourceWidth+'×'+a.sourceHeight:'—';}
/* M6.2 受控重试：以后端 t.retry 为准（服务端权威判定），fixture/旧数据回退到客户端镜像。 */
function visualRetryInfo(t){
  if(t&&t.retry&&typeof t.retry.eligible==='boolean')return t.retry;
  var a=currentAttempt(t);
  var note=((a&&a.approval&&a.approval.note)||'').trim();
  var eligible=!!t&&!!a&&t.state==='rejected'
    &&Number(a.attemptNo)===Number(t.currentAttempt)
    &&a.approval&&a.approval.decision==='rejected'&&!!note
    &&Number(t.currentAttempt)<Number(t.maxAttempts)
    &&(!t.pipelineState||t.pipelineState==='waiting_visual_approval')
    &&a.provider!=='stub';
  return {eligible:eligible,reason:eligible?null:'客户端镜像判定不可重试',code:eligible?null:'invalid-state',expectedNextAttemptNo:t?Number(t.currentAttempt)+1:null};
}
/* 明确区分阶段：排队中 / 等待 Agent 领取 / 生成中 / 附件校验中，绝不统称“处理中”。 */
function visualStateBadge(t){
  var s=t.state;
  if(s==='waiting_visual_approval')return '<span class="badge badge-amber">等待视觉审核</span>';
  if(s==='approved')return '<span class="badge badge-green">已批准</span>';
  if(s==='rejected')return '<span class="badge badge-red">已驳回</span>';
  if(s==='retry')return '<span class="badge badge-blue">等待 Agent 领取</span>';
  if(s==='queued')return '<span class="badge badge-gray">排队中</span>';
  if(s==='generating')return '<span class="badge badge-blue">生成中</span>';
  if(s==='generated')return '<span class="badge badge-blue">附件校验中</span>';
  if(s==='failed')return '<span class="badge badge-red">重试失败</span>';
  return '<span class="badge badge-gray">'+esc(s)+'</span>';
}
function techDetails(t,a){

}

/* ============ lightbox（受控 attemptId 端点，只读） ============ */
var visualLightbox={items:[],index:-1,lastFocused:null};
var ATTEMPT_ID_RE=/^va-[a-f0-9]{20}$/;
function visualTaskForAttempt(attemptId){var found=null;(D.factory&&D.factory.visual&&D.factory.visual.batches||[]).some(function(batch){return (batch.tasks||[]).some(function(task){var attempt=currentAttempt(task);if(attempt&&attempt.id===attemptId){found={batch:batch,task:task,attempt:attempt};return true;}return false;});});return found;}
function visualLightboxItems(attemptId){
  if(!ATTEMPT_ID_RE.test(attemptId))return [];
  var found=visualTaskForAttempt(attemptId);
  if(!found)return [];
  return (found.batch.tasks||[]).map(function(t){var a=currentAttempt(t);if(!a||!a.importedRelativePath)return null;return {task:t,attempt:a,attemptId:a.id};}).filter(Boolean);
}
function visualLightboxCurrent(){return visualLightbox.items[visualLightbox.index];}
function visualAssetUrl(attemptId){if(typeof attemptId!=='string'||!ATTEMPT_ID_RE.test(attemptId))return null;return '/sparkos/visual/asset?attemptId='+encodeURIComponent(attemptId);}
function renderVisualLightboxImage(){
  var lb=$('visual-lightbox');
  var item=visualLightboxCurrent();
  if(!lb||!item)return;
  var img=lb.querySelector('[data-lightbox-img]');
  var error=lb.querySelector('[data-lightbox-error]');
  var msg=lb.querySelector('[data-lightbox-error-msg]');
  var link=lb.querySelector('[data-lightbox-error-link]');
  var linkCurrent=lb.querySelector('[data-lightbox-error-current]');
  var url=visualAssetUrl(item.attemptId);
  img.alt=item.task.altText||'';
  img.classList.remove('hidden');
  error.classList.remove('show');
  if(!url){
    msg.textContent='图片加载失败（attemptId 非法：'+item.attemptId+'）';
    img.classList.add('hidden');
    error.classList.add('show');
    return;
  }
  img.src=url;
  link.href=url;
  linkCurrent.href=url;
  img.onerror=function(){
    img.classList.add('hidden');
    msg.textContent='图片加载失败（无法加载视觉资产 '+item.attemptId+'，请用下方链接重试）';
    error.classList.add('show');
  };
}
function renderVisualLightboxInfo(){
  var lb=$('visual-lightbox');
  var item=visualLightboxCurrent();
  if(!lb||!item)return;
  var a=item.attempt,t=item.task;
  var sha=a.importedSha256?esc(String(a.importedSha256).slice(0,12)):'—';
  var rows=[
    ['assetId',esc(t.assetId)],
    ['attempt 编号',esc(String(a.attemptNo))],
    ['provider/model',esc((a.provider||'—')+' / '+(a.model||'—'))],
    ['尺寸',esc(dimsOf(a))],
    ['MIME',esc(a.sourceMediaType||'—')],
    ['bytes',esc(String(a.sourceBytes==null?0:a.sourceBytes))],
    ['SHA',sha],
    ['altText',esc(t.altText)],
    ['placement',esc(t.placement)],
    ['prompt',esc(t.prompt)]
  ].map(function(r){return '<div class="visual-lb-row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';}).join('');
  var indexLabel='<div class="visual-lb-row"><b>图片</b><span>'+(visualLightbox.index+1)+' / '+visualLightbox.items.length+'</span></div>';
  var url=visualAssetUrl(a.id);
  var openLink=url?'<div class="visual-lb-row"><b>原图</b><a data-lightbox-anchor data-lightbox-open href="'+url+'" target="_blank" rel="noopener noreferrer">打开原图</a> <a data-lightbox-anchor data-lightbox-open-current href="'+url+'">在当前标签查看原图</a></div>':'';
  var reviewRow=isReviewable(item.task,item.attempt)?'<div class="visual-lb-row"><b>审核</b><button type="button" class="btn btn-approve" data-visual-approve="'+esc(item.attemptId)+'">批准图片</button> <button type="button" class="btn btn-reject" data-visual-reject="'+esc(item.attemptId)+'">驳回图片</button></div>':'';
  lb.querySelector('[data-lightbox-info]').innerHTML=indexLabel+rows+openLink+reviewRow;
}
function openVisualLightbox(attemptId,trigger){
  if(!ATTEMPT_ID_RE.test(attemptId))return;
  var items=visualLightboxItems(attemptId);
  if(!items.length)return;
  var index=-1;
  for(var i=0;i<items.length;i++){if(items[i].attemptId===attemptId){index=i;break;}}
  if(index<0)return;
  visualLightbox.items=items;visualLightbox.index=index;visualLightbox.lastFocused=trigger||document.activeElement;
  var lb=$('visual-lightbox');
  lb.classList.remove('hidden');
  document.body.classList.add('modal-open');
  renderVisualLightboxImage();
  renderVisualLightboxInfo();
  var close=lb.querySelector('[data-lightbox-close]');
  if(close)close.focus();
}
function closeVisualLightbox(){
  if(visualLightbox.index<0)return;
  var lb=$('visual-lightbox');
  lb.classList.add('hidden');
  document.body.classList.remove('modal-open');
  var img=lb.querySelector('[data-lightbox-img]');
  if(img)img.removeAttribute('src');
  var last=visualLightbox.lastFocused;
  visualLightbox.items=[];visualLightbox.index=-1;visualLightbox.lastFocused=null;
  if(last&&typeof last.focus==='function')last.focus();
}
function copyTechId(btn){
  var val=btn.getAttribute('data-copy')||'';
  if(!val)return;
  var done=function(){var old=btn.textContent;btn.textContent='已复制';btn.classList.add('copied');setTimeout(function(){btn.textContent=old;btn.classList.remove('copied');},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(val).then(done,function(){fallbackCopy(val,done);});}
  else{fallbackCopy(val,done);}
}
function fallbackCopy(text,done){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);done();
}
function stepVisualLightbox(delta){
  var count=visualLightbox.items.length;
  if(!count||visualLightbox.index<0)return;
  visualLightbox.index=(visualLightbox.index+delta+count)%count;
  renderVisualLightboxImage();
  renderVisualLightboxInfo();
}

/* ============ 视觉审核与按意见重试（V2 受控操作） ============ */
var reviewDialog={attemptId:null,decision:null,batch:null,task:null,attempt:null,lastFocus:null,busy:false};
var toastTimer=null;
function isReviewable(task,attempt){
  return !!task&&!!attempt&&task.state==='waiting_visual_approval'
    &&Number(task.currentAttempt)===Number(attempt.attemptNo)
    &&!!attempt.importedRelativePath
    &&(!attempt.approval||attempt.approval.decision==='pending');
}
function showToast(msg,type){
  var t=$('toast');t.textContent=msg;t.className='toast '+(type||'success');t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}
async function refreshVisual(packageId){
  var resp=await fetch('/sparkos/visual/status?packageId='+encodeURIComponent(packageId));
  var json=await resp.json();
  if(!resp.ok||!json||!json.ok)throw new Error('刷新视觉状态失败');
  var fresh=json.value.batches||[];
  var kept=(D.factory&&D.factory.visual&&D.factory.visual.batches||[]).filter(function(b){return b.packageId!==packageId;});
  D.factory=D.factory||{};D.factory.visual=D.factory.visual||{batches:[]};
  D.factory.visual.batches=kept.concat(fresh);
}
/* M6.3：草稿决策/修订后只读重读工作台数据（GET /sparkos/data，不产生 POST）。 */
async function refreshWorkbenchData(){
  var resp=await fetch('/sparkos/data');
  var json=await resp.json();
  if(!resp.ok||!json||!json.ok)throw new Error('刷新工作台数据失败');
  D=json.value;
}
function openVisualReviewDialog(attemptId,decision,trigger){
  var found=visualTaskForAttempt(attemptId);
  if(!found)return;
  var t=found.task,a=found.attempt,b=found.batch;
  if(!isReviewable(t,a)){
    showToast('该图片当前不可审核，正在刷新最新状态','error');
    refreshVisual(b.packageId).then(function(){renderRouter();}).catch(function(){});
    return;
  }
  reviewDialog.attemptId=attemptId;reviewDialog.decision=decision;
  reviewDialog.batch=b;reviewDialog.task=t;reviewDialog.attempt=a;
  reviewDialog.lastFocus=trigger||document.activeElement;reviewDialog.busy=false;
  renderReviewDialog();
  var dlg=$('review-dialog');
  dlg.classList.remove('hidden');
  document.body.classList.add('modal-open');
  var close=dlg.querySelector('[data-review-close]');if(close)close.focus();
}
function renderReviewDialog(){
  var d=reviewDialog;
  var t=d.task,a=d.attempt,b=d.batch;
  var approve=d.decision==='approved';
  $('reviewDialogTitle').textContent=approve?'批准图片':'驳回图片';
  var url=visualAssetUrl(a.id);
  var pkgShort=b.packageId?String(b.packageId).slice(0,10):'—';
  var h=[];
  if(url)h.push('<img class="review-thumb" alt="'+esc(t.altText||'')+'" src="'+url+'">');
  h.push('<div class="kv"><div><b>assetId</b>'+esc(t.assetId)+'</div><div><b>placement</b>'+esc(t.placement)+'</div><div><b>attempt</b>#'+esc(String(a.attemptNo))+'</div><div><b>provider/model</b>'+esc((a.provider||'—')+' / '+(a.model||'—'))+'</div><div><b>尺寸</b>'+esc(dimsOf(a))+'</div><div><b>packageId</b><span class="mono">'+esc(pkgShort)+'</span></div></div>');
  if(!approve&&t.prompt)h.push('<div class="kv" style="margin-top:8px"><b>原 prompt 摘要</b><span>'+esc(String(t.prompt).slice(0,120))+(String(t.prompt).length>120?'…':'')+'</span></div>');
  h.push('<div style="margin-top:12px"><label for="review-note" style="font-size:12px;font-weight:700;display:block;margin-bottom:4px">'+(approve?'审核意见（可选）':'驳回意见（必填）')+'</label><textarea id="review-note" class="modal-note" maxlength="2000" placeholder="'+(approve?'可填写备注，留空也可以':'请说明需要修改的内容')+'"></textarea></div>');
  h.push('<div class="modal-warn">'+(approve?'批准后将计入视觉审核进度，但不会自动发布。':'图片已驳回，需进入后续受控重试流程（本轮未开放自动重试）。')+'</div>');
  h.push('<div class="modal-err" id="reviewDialogErr"></div>');
  $('reviewDialogBody').innerHTML=h.join('');
  $('reviewDialogFoot').innerHTML='<button type="button" class="btn btn-ghost" data-review-cancel>取消</button><button type="button" class="btn '+(approve?'btn-approve':'btn-reject')+'" data-review-confirm>'+(approve?'确认批准':'确认驳回')+'</button>';
}
function closeReviewDialog(){
  if(!reviewDialog.attemptId)return;
  var dlg=$('review-dialog');
  dlg.classList.add('hidden');
  if(visualLightbox.index<0&&!drawer.open)document.body.classList.remove('modal-open');
  var last=reviewDialog.lastFocus;
  reviewDialog.attemptId=null;reviewDialog.decision=null;reviewDialog.batch=null;reviewDialog.task=null;reviewDialog.attempt=null;reviewDialog.lastFocus=null;reviewDialog.busy=false;
  if(last&&typeof last.focus==='function')last.focus();
}
function showReviewDialogError(msg){
  var e=$('reviewDialogErr');
  if(e){e.textContent=msg;e.classList.add('show');}
}
function setReviewBusy(busy,label){
  reviewDialog.busy=busy;
  var dlg=$('review-dialog');
  var btn=dlg.querySelector('[data-review-confirm]');
  var cancel=dlg.querySelector('[data-review-cancel]');
  if(btn){btn.disabled=busy;if(label)btn.textContent=label;}
  if(cancel)cancel.disabled=busy;
}
function handleReviewError(err){
  var code=err&&err.code;
  var msg='请求失败，请重试';
  var needsRefresh=false;
  if(code==='not-found'){msg='任务或图片不存在，可能已变化，正在刷新最新状态';needsRefresh=true;}
  else if(code==='not-current-attempt'||code==='decision-conflict'||code==='invalid-state'||code==='conflict'){msg='该图片状态已变化，正在刷新最新状态';needsRefresh=true;}
  else if(code==='review-note-required'){msg='驳回图片必须填写审核意见';}
  else if(code==='payload-too-large'){msg='意见过长（超过 2000 字）';}
  else if(code==='bad-request'){msg=err.message||'输入有误，请检查后重试';}
  else if(String(code).indexOf('http-5')===0){msg='服务暂时不可用，请稍后重试';}
  else if(String(code).indexOf('http-4')===0){msg='请求被拒绝（'+String(code).replace('http-','HTTP ')+'），请检查后重试';}
  showReviewDialogError(msg);
  if(needsRefresh&&reviewDialog.batch){
    refreshVisual(reviewDialog.batch.packageId).then(function(){renderRouter();}).catch(function(){});
  }
  // 不关闭对话框；409 后由刷新结果决定下一步
}
async function submitVisualReview(){
  if(!reviewDialog.attemptId||reviewDialog.busy)return;
  var d=reviewDialog;
  var noteEl=$('review-note');
  var note=noteEl?noteEl.value.trim():'';
  if(d.decision==='rejected'&&!note){showReviewDialogError('驳回意见必填');if(noteEl)noteEl.focus();return;}
  if(note.length>2000){showReviewDialogError('意见不能超过 2000 字');return;}
  var errEl=$('reviewDialogErr');if(errEl)errEl.classList.remove('show');
  setReviewBusy(true,'提交中…');
  try{
    var resp=await fetch('/sparkos/visual/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({attemptId:d.attemptId,decision:d.decision,note:note})});
    var json=null;try{json=await resp.json();}catch(e){json=null;}
    if(!resp.ok||!json||!json.ok){
      var e=new Error((json&&json.error&&json.error.message)||('HTTP '+resp.status));
      e.code=(json&&json.error&&json.error.code)||('http-'+resp.status);
      e.status=resp.status;
      throw e;
    }
    var pkg=d.batch.packageId;
    var approved=d.decision==='approved';
    closeReviewDialog();
    if(visualLightbox.index>=0)closeVisualLightbox();
    showToast(approved?'图片已批准':'图片已驳回','success');
    try{await refreshVisual(pkg);}catch(e2){showToast('已提交，但刷新状态失败：'+String(e2.message||e2),'error');}
    renderRouter();
  }catch(err){
    setReviewBusy(false);
    handleReviewError(err);
  }
}

function handleRetryError(err){
  var code=err&&err.code;
  var msg='请求失败，请重试';
  var needsRefresh=false;
  if(code==='not-found'){msg='任务或图片不存在，可能已变化，正在刷新最新状态';needsRefresh=true;}
  else if(code==='not-current-attempt'||code==='retry-conflict'||code==='retry-identity-mismatch'||code==='invalid-state'||code==='idempotency-conflict'){msg='任务状态已变化，正在刷新';needsRefresh=true;}
  else if(code==='approved-cannot-retry'){msg='该图片已批准，不能重试';needsRefresh=true;}
  else if(code==='max-attempts-reached'){msg='已达到最大重试次数，需要人工处理';needsRefresh=true;}
  else if(code==='retry-note-required'){msg='缺少有效的驳回意见，不能重试';needsRefresh=true;}
  else if(code==='stub-cannot-retry'){msg='测试图片不能重试';}
  else if(code==='supplementary-too-long'){msg='补充要求不能超过 '+RETRY_SUP_MAX+' 字';}
  else if(code==='supplementary-forbidden'){msg=err.message||'补充要求包含不允许的内容';}
  else if(code==='bad-request'){msg=err.message||'输入有误，请检查后重试';}
  else if(code==='payload-too-large'){msg='请求体过大';}
  else if(String(code).indexOf('http-5')===0){msg='服务暂时不可用，请稍后重试';}
  showRetryDialogError(msg);
  if(needsRefresh&&retryDialog.batch){
    refreshVisual(retryDialog.batch.packageId).then(function(){renderRouter();}).catch(function(){});
  }
}
async function submitVisualRetry(){

  var d=retryDialog;var t=d.task,a=d.attempt,b=d.batch;

  if(sup.length>RETRY_SUP_MAX){showRetryDialogError('补充要求不能超过 '+RETRY_SUP_MAX+' 字');return;}
  if(/^(?:[a-z]:[\\/]|\/)/i.test(sup)||/^(?:https?|file):\/\//i.test(sup)||/sha256:[a-f0-9]{64}/i.test(sup)||/attachment\s*id/i.test(sup)||/(?:api[_-]?key|secret|access[_-]?token|bearer)\s*[:=]/i.test(sup)){
    showRetryDialogError('补充要求不得包含本地路径、URL、附件 ID 或 Provider 密钥');return;

  var errEl=$('retryDialogErr');if(errEl)errEl.classList.remove('show');
  setRetryBusy(true,'正在创建重试任务');

    var payload={packageId:b.packageId,taskId:t.id,currentAttemptId:a.id,assetId:t.assetId,idempotencyKey:'retry:'+t.id+':'+a.id};
    if(sup)payload.supplementaryInstruction=sup;

    if(!resp.ok||!json||!json.ok){
      var e=new Error((json&&json.error&&json.error.message)||('HTTP '+resp.status));
      e.code=(json&&json.error&&json.error.code)||('http-'+resp.status);
      e.status=resp.status;
      throw e;

/* ============ M6.2 只读轮询（仅 GET；页面隐藏/离开视觉页停止；单包单轮询器；网络错误退避） ============ */
var visualPoller={timers:{},delayMs:6000,maxDelayMs:30000};
/* 测试钩子：允许 DOM 回归测试在隔离 fixture 中调节轮询节奏（生产数据不依赖它）。 */
window.sparkosVisualPoller=visualPoller;
function visualPipelineActive(){
  var active={};
  (D.factory&&D.factory.visual&&D.factory.visual.batches||[]).forEach(function(b){
    var has=false;
    (b.tasks||[]).forEach(function(t){if(t.pipelineState==='queued'||t.pipelineState==='retry'||t.pipelineState==='generating'||t.pipelineState==='generated')has=true;});
    if(has)active[b.packageId]=true;
  });
  return Object.keys(active);
}
function stopVisualPolling(){
  Object.keys(visualPoller.timers).forEach(function(k){clearTimeout(visualPoller.timers[k]);});
  visualPoller.timers={};
}
function scheduleVisualPoll(packageId,delay){
  if(document.hidden||state.view!=='visual')return;
  if(visualPoller.timers[packageId])clearTimeout(visualPoller.timers[packageId]);
  visualPoller.timers[packageId]=setTimeout(function(){visualPoller.timers[packageId]=null;pollVisualPackage(packageId);},delay||visualPoller.delayMs);
}
async function pollVisualPackage(packageId){
  if(document.hidden||state.view!=='visual')return;
  try{
    await refreshVisual(packageId);
    visualPoller.delayMs=6000;
    renderRouter();
  }catch(e){
    // 网络错误退避
    visualPoller.delayMs=Math.min(visualPoller.delayMs*2,visualPoller.maxDelayMs);
  }
  scheduleVisualPoll(packageId,visualPoller.delayMs);
}
function startVisualPolling(){
  stopVisualPolling();
  visualPoller.delayMs=6000;
  var packages=visualPipelineActive();
  packages.forEach(function(pkg){scheduleVisualPoll(pkg,visualPoller.delayMs);});
}
async function manualRefreshVisual(){
  var bs=(D.factory&&D.factory.visual&&D.factory.visual.batches)||[];
  if(!bs.length){showToast('当前没有视觉批次','info');return;}
  var pkgs=[];
  bs.forEach(function(b){if(pkgs.indexOf(b.packageId)<0)pkgs.push(b.packageId);});
  try{
    for(var i=0;i<pkgs.length;i++){await refreshVisual(pkgs[i]);}
    renderRouter();
    showToast('已刷新视觉状态','success');
  }catch(e){showToast('刷新失败：'+String(e&&e.message||e),'error');}
}
function visActions(t,a){
  var decAt=(a&&a.approval&&a.approval.decidedAt)?fmtISO(a.approval.decidedAt):null;
  if(isReviewable(t,a)){
    return '<div class="vis-actions"><button type="button" class="btn btn-ghost" data-visual-open="'+esc(a.id)+'" aria-label="查看原图">查看原图</button><button type="button" class="btn btn-approve" data-visual-approve="'+esc(a.id)+'">批准图片</button><button type="button" class="btn btn-reject" data-visual-reject="'+esc(a.id)+'">驳回图片</button></div>';
  }
  if(t.state==='approved'){
    return '<div class="vis-status"><span class="badge badge-green">已批准</span>'+(decAt?'<span class="dim">'+esc(decAt)+'</span>':'')+(t.reviewNote?'<span class="dim">意见：'+esc(t.reviewNote)+'</span>':'')+'</div>';
  }
  if(t.state==='rejected'){
    // 已驳回：主要操作是“按意见重试”；不再显示批准/驳回；历史 attempt 只能查看。
    var note=(a&&a.approval&&a.approval.note)||t.reviewNote||'';
    var info=visualRetryInfo(t);
    var h=['<div class="vis-actions">'];
    h.push('<button type="button" class="btn btn-ghost" data-visual-open="'+esc(a?a.id:'')+'" aria-label="查看原图">查看原图</button>');
    if(note){h.push('<details class="tech" style="margin:0"><summary>查看完整意见</summary><div class="tech-body">'+esc(note)+'</div></details>');}
    if(info.eligible&&a){h.push('<button type="button" class="btn btn-retry" data-visual-retry="'+esc(t.id)+'">按意见重试</button>');}
    h.push('</div><div class="vis-status"><span class="badge badge-red">已驳回</span>'+(decAt?'<span class="dim">驳回时间 '+esc(decAt)+'</span>':''));
    if(note){h.push('<div class="vis-note-box"><span class="vn-label">驳回意见：</span>'+esc(note.length>120?note.slice(0,120)+'…':note)+'</div>');}
    if(info.eligible){h.push('<div class="dim">下一 attempt #'+esc(String(info.expectedNextAttemptNo))+' · 已用 '+esc(String(t.currentAttempt))+' / '+esc(String(t.maxAttempts))+' 次</div>');}
    else if(info.code==='max-attempts-reached'){h.push('<div class="vis-max-note">已达到最大重试次数（'+esc(String(t.currentAttempt))+'/'+esc(String(t.maxAttempts))+'），需要人工处理。</div>');}
    else if(a&&a.provider==='stub'){h.push('<div class="vis-stub-note">测试图片（stub）不可重试。</div>');}
    else{h.push('<div class="vis-stub-note">'+esc(info.reason||'当前不可重试')+'。</div>');}
    h.push('</div>');
    return h.join('');
  }
  if(t.state==='retry'){
    return '<div class="vis-status"><span class="badge badge-blue">等待 Agent 领取</span><span class="dim">已按驳回意见创建重试任务；DSH Agent 领取后将生成新图片并重新进入视觉审核。</span></div>';
  }
  if(t.state==='failed'){
    return '<div class="vis-status"><span class="badge badge-red">重试失败</span>'+(t.lastError?'<span class="dim">'+esc(t.lastError)+'</span>':'')+'</div>';
  }
  if(t.state==='queued'||t.state==='generating'||t.state==='generated'){
    var pipe=t.state==='queued'?'排队中 · 等待 Agent 领取':t.state==='generating'?'生成中 · 由 DSH Agent 执行（只读轮询）':'附件校验中';
    return '<div class="vis-status"><span class="dim">'+esc(pipe)+'</span></div>';
  }
  return '';
}

/* ============ bindings ============ */
(function(){
  var lb=$('visual-lightbox');
  if(lb){
    lb.querySelector('[data-lightbox-close]').addEventListener('click',function(ev){ev.stopPropagation();closeVisualLightbox();});
    lb.querySelector('[data-lightbox-backdrop]').addEventListener('click',function(ev){ev.stopPropagation();closeVisualLightbox();});
    lb.querySelector('[data-lightbox-prev]').addEventListener('click',function(ev){ev.stopPropagation();stepVisualLightbox(-1);});
    lb.querySelector('[data-lightbox-next]').addEventListener('click',function(ev){ev.stopPropagation();stepVisualLightbox(1);});
    lb.addEventListener('click',function(ev){
      var anchor=ev.target&&ev.target.closest?ev.target.closest('[data-lightbox-anchor]'):null;
      if(anchor)ev.stopPropagation();
    });
  }
  var dr=$('drawer');
  if(dr){
    dr.querySelector('[data-drawer-close]').addEventListener('click',closeDrawer);
    dr.querySelector('[data-drawer-backdrop]').addEventListener('click',closeDrawer);
  }
  $('menuToggle').addEventListener('click',function(){$('sidebar').classList.toggle('open');});
  document.addEventListener('click',function(ev){
    var t=ev.target;
    if(!t||!t.closest)return;
    var nav=t.closest('[data-nav]');if(nav){navigate(nav.getAttribute('data-nav'));return;}
    var flow=t.closest('[data-flow]');if(flow){navigate(flow.getAttribute('data-flow'));return;}
    var goto=t.closest('[data-goto]');if(goto){navigate(goto.getAttribute('data-goto'));return;}
    var pkg=t.closest('[data-pkg]');if(pkg){state.filters.creation.packageId=pkg.getAttribute('data-pkg');setHashParams({pkg:state.filters.creation.packageId});renderView('creation');return;}
    var pf=t.closest('[data-pf]');if(pf){state.filters.creation.platform=pf.getAttribute('data-pf');setHashParams({pf:state.filters.creation.platform});renderView('creation');return;}
    var pv=t.closest('[data-pv]');if(pv){state.filters.creation.previewMode=pv.getAttribute('data-pv');setHashParams({pv:state.filters.creation.previewMode});renderView('creation');return;}
    var idr=t.closest('[data-intel-drawer]');if(idr){openIntelDrawer(idr.getAttribute('data-intel-drawer'));return;}
    var cdr=t.closest('[data-cluster-drawer]');if(cdr){openClusterDrawer(cdr.getAttribute('data-cluster-drawer'));return;}
    var tdr=t.closest('[data-topic-drawer]');if(tdr){openTopicDrawer(tdr.getAttribute('data-topic-drawer'));return;}
    var vt=t.closest('[data-visual-thumb]');if(vt){openVisualLightbox(vt.getAttribute('data-visual-thumb'),vt);return;}
    var vo=t.closest('[data-visual-open]');if(vo){openVisualLightbox(vo.getAttribute('data-visual-open'),vo);return;}
    var va=t.closest('[data-visual-approve]');if(va){openVisualReviewDialog(va.getAttribute('data-visual-approve'),'approved',va);return;}
    var vr=t.closest('[data-visual-reject]');if(vr){openVisualReviewDialog(vr.getAttribute('data-visual-reject'),'rejected',vr);return;}
    var rc=t.closest('[data-review-close]');if(rc){closeReviewDialog();return;}
    var rb=t.closest('[data-review-backdrop]');if(rb){closeReviewDialog();return;}
    var rcc=t.closest('[data-review-cancel]');if(rcc){closeReviewDialog();return;}
    var rcf=t.closest('[data-review-confirm]');if(rcf){submitVisualReview();return;}
    // M6.2 受控重试对话框
    var vretry=t.closest('[data-visual-retry]');if(vretry){openVisualRetryDialog(vretry.getAttribute('data-visual-retry'),vretry);return;}
    var rtc=t.closest('[data-retry-close]');if(rtc){closeRetryDialog();return;}
    var rtb=t.closest('[data-retry-backdrop]');if(rtb){closeRetryDialog();return;}
    var rtcancel=t.closest('[data-retry-cancel]');if(rtcancel){closeRetryDialog();return;}
    var rtconfirm=t.closest('[data-retry-confirm]');if(rtconfirm){submitVisualRetry();return;}
    var vrfr=t.closest('[data-visual-refresh]');if(vrfr){manualRefreshVisual();return;}
    var ah=t.closest('[data-attempt-history]');if(ah){openVisualAttemptDrawer(ah.getAttribute('data-attempt-history'));return;}
    var cp=t.closest('[data-copy]');if(cp){copyTechId(cp);return;}
    // M6.3 草稿受控审批/修订
    var dd=t.closest('[data-draft-decision]');if(dd){openDraftDecisionDialog(dd.getAttribute('data-package'),dd.getAttribute('data-draft-decision'),dd);return;}
    var ddc=t.closest('[data-draft-decision-close]');if(ddc){closeDraftDecisionDialog();return;}
    var ddb=t.closest('[data-draft-decision-backdrop]');if(ddb){closeDraftDecisionDialog();return;}
    var ddcancel=t.closest('[data-draft-decision-cancel]');if(ddcancel){closeDraftDecisionDialog();return;}
    var ddconfirm=t.closest('[data-draft-decision-confirm]');if(ddconfirm){submitDraftDecision();return;}
    var dr=t.closest('[data-draft-revise]');if(dr){openDraftReviseDialog(dr.getAttribute('data-draft-revise'),dr);return;}
    var drc=t.closest('[data-draft-revise-close]');if(drc){closeDraftReviseDialog();return;}
    var drb=t.closest('[data-draft-revise-backdrop]');if(drb){closeDraftReviseDialog();return;}
    var drcancel=t.closest('[data-draft-revise-cancel]');if(drcancel){closeDraftReviseDialog();return;}
    var drconfirm=t.closest('[data-draft-revise-confirm]');if(drconfirm){submitDraftRevise();return;}
    // 审核中心精确导航：前往具体对象
    var gv=t.closest('[data-goto-visual]');if(gv){navigate('visual');setTimeout(function(){var card=document.querySelector('[data-vis-task="'+gv.getAttribute('data-goto-visual')+'"]');if(card){card.scrollIntoView({block:'center'});card.style.outline='2px solid var(--orange)';setTimeout(function(){card.style.outline='';},1600);}},80);return;}
    var gc=t.closest('[data-goto-creation]');if(gc){state.filters.creation.packageId=gc.getAttribute('data-goto-creation');navigate('creation');setTimeout(function(){setHashParams({pkg:state.filters.creation.packageId});},80);return;}
    var gt=t.closest('[data-goto-topic]');if(gt){navigate('topics');setTimeout(function(){var card=document.querySelector('[data-topic-drawer="'+gt.getAttribute('data-goto-topic')+'"]');if(card){card.scrollIntoView({block:'center'});card.style.outline='2px solid var(--orange)';setTimeout(function(){card.style.outline='';},1600);}},80);return;}
  });
  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(!t)return;
    if(t.getAttribute&&t.getAttribute('data-rf')==='type'){state.filters.review.type=t.value;setHashParams({type:t.value});applyReviewFilters();return;}
    if(t.getAttribute&&t.getAttribute('data-rf')==='urgency'){state.filters.review.urgency=t.value;setHashParams({urgency:t.value});applyReviewFilters();return;}
    if(t.getAttribute&&t.getAttribute('data-rf')==='time'){state.filters.review.time=t.value;setHashParams({time:t.value});applyReviewFilters();return;}
  });
  document.addEventListener('input',function(ev){
    var t=ev.target;
    if(!t||!t.getAttribute)return;
    if(t.getAttribute('data-rf')==='q'){state.filters.review.q=t.value;setHashParams({q:t.value});applyReviewFilters();}
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){
      if(visualLightbox.index>=0){ev.preventDefault();closeVisualLightbox();return;}
      if(drawer.open){ev.preventDefault();closeDrawer();return;}
      if($('retry-dialog')&&!$('retry-dialog').classList.contains('hidden')){ev.preventDefault();closeRetryDialog();return;}
      if($('draft-decision-dialog')&&!$('draft-decision-dialog').classList.contains('hidden')){ev.preventDefault();closeDraftDecisionDialog();return;}
      if($('draft-revise-dialog')&&!$('draft-revise-dialog').classList.contains('hidden')){ev.preventDefault();closeDraftReviseDialog();return;}
    }
    if(visualLightbox.index>=0){
      if(ev.key==='ArrowLeft'){ev.preventDefault();stepVisualLightbox(-1);return;}
      if(ev.key==='ArrowRight'){ev.preventDefault();stepVisualLightbox(1);}
    }
  });
  // M6.2：页面不可见时暂停轮询，回到可见且仍在视觉页时恢复
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){stopVisualPolling();}
    else if(state.view==='visual'){startVisualPolling();}
  });
  boot();
})();

</script>
