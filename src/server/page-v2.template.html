<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SparkOS 工作台 V2</title>
<style>
:root{
  --bg:#FBF6EF;--surface:#FFFFFF;--surface-2:#F6EFE2;--ink:#2B241C;--ink-2:#52493B;--ink-3:#6E6150;
  --line:#EADFCB;--line-strong:#DCCBAE;
  --orange:#E8563D;--orange-strong:#C9422C;--orange-soft:#FBE9E3;
  --green:#3E7D56;--green-soft:#E7F0EA;--amber:#A97B1F;--amber-soft:#F7EEDA;--red:#B23A26;--red-soft:#F9E4DE;
  --blue:#2F6A94;--blue-soft:#E4EEF5;--gray:#9A8D78;--gray-soft:#EFEAE0;
  --radius:12px;--radius-s:10px;
  --shadow:0 1px 2px rgba(43,36,28,.05),0 2px 10px rgba(43,36,28,.05);
  --font:'PingFang SC',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
body.modal-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- layout ---- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;transition:transform .18s ease}
.brand{display:flex;align-items:center;gap:9px;height:64px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-size:15px;font-weight:700;line-height:1.2}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.06em;line-height:1}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--radius-s);color:var(--ink-2);font-size:13.5px;text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--orange-soft);color:var(--orange-strong);font-weight:600}
.nav-item svg{flex:none;width:17px;height:17px}
.nav-preview-note{margin:10px 12px;padding:9px 11px;border-radius:9px;background:var(--gray-soft);color:var(--ink-3);font-size:11px;line-height:1.6;flex:none}
.main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;height:64px;background:rgba(251,246,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex:none}
.menu-toggle{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.topbar-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;min-width:150px;max-height:48px;line-height:1.2}
.topbar-title svg{width:22px;height:22px;flex:none}
.topbar-title span{white-space:nowrap}
.topbar-meta{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 14px;color:var(--ink-3);font-size:12px;white-space:nowrap;min-width:0;flex-shrink:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill-orange{background:var(--orange-soft);color:var(--orange-strong)}
.pill-green{background:var(--green-soft);color:var(--green)}
.pill-amber{background:var(--amber-soft);color:var(--amber)}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-blue{background:var(--blue-soft);color:var(--blue)}
.pill-gray{background:var(--gray-soft);color:var(--ink-3)}
.view{padding:28px 32px;max-width:1480px;width:100%;margin:0 auto}
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 10px 40px rgba(43,36,28,.18)}
  .main{margin-left:0}
  .menu-toggle{display:inline-flex}
  .view{padding:20px 24px}
}
@media (max-width:767px){
  .topbar{padding:0 12px}
  .view{padding:14px 12px}
  .hide-sm{display:none}
  .topbar-meta{gap:8px}
}

/* ---- shared components ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;color:var(--orange)}
.topic-section{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13.5px;line-height:1.7}
.topic-section h5{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.topic-section p{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
.stat-label{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.stat-label svg{width:13px;height:13px}
.stat-value{font-size:23px;font-weight:700;margin-top:3px;line-height:1.2}
.stat-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-gray{background:var(--gray-soft);color:var(--ink-3)}
.badge-orange{background:var(--orange-soft);color:var(--orange-strong)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}.dot-gray{background:var(--gray)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-size:11.5px;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row-click{cursor:pointer}
tr.row-click:hover{background:var(--surface-2)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-3);font-size:13px;background:var(--surface)}
.empty svg{width:30px;height:30px;margin:0 auto 8px;display:block;color:var(--ink-3);opacity:.55}
.review-notice{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:12px;line-height:1.5;margin-bottom:12px}
.review-notice svg{width:22px;height:22px;flex:none}
.review-notice .rn-text{flex:1;min-width:0}
.empty-note{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.7;max-width:520px;margin-left:auto;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
.btn-ghost{border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);word-break:break-all}
.dim{color:var(--ink-3);font-size:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
.creation-grid{display:grid;grid-template-columns:320px minmax(480px,1fr) 320px;grid-template-areas:"list preview fact";gap:14px;align-items:start}
.creation-grid .cg-list{grid-area:list;min-width:0}
.creation-grid .cg-preview{grid-area:preview;min-width:0}
.creation-grid .cg-fact{grid-area:fact;min-width:0}
.preview-frame{width:100%;max-width:720px;margin:0 auto;transition:max-width .15s ease}
.preview-frame.mobile{max-width:375px}
.preview-frame iframe{width:100%;height:460px;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.preview-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
@media (max-width:1250px){.creation-grid{grid-template-columns:320px 1fr;grid-template-areas:"list preview" "fact fact"}}
@media (max-width:860px){.creation-grid{grid-template-columns:1fr;grid-template-areas:"list" "preview" "fact"}}
details.tech{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2);margin-top:8px}
details.tech summary{cursor:pointer;padding:7px 11px;font-size:12px;color:var(--ink-2);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.tech summary::-webkit-details-marker{display:none}
details.tech[open] summary{border-bottom:1px solid var(--line)}
details.tech .tech-body{padding:9px 11px;font-size:12px;color:var(--ink-2);line-height:1.7;overflow-wrap:anywhere}
.todo-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.todo-row.sel{background:var(--orange-soft);border-radius:var(--radius-s);padding-left:8px;padding-right:8px}
.todo-row:last-child{border-bottom:none}
.todo-main{flex:1;min-width:0}
.todo-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-meta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;text-align:center}
.pipe .p-name{font-size:12.5px;font-weight:700;margin-top:5px}
.pipe .p-count{font-size:11px;color:var(--ink-3);margin-top:1px}
.pipe.p-done{border-color:var(--green);background:var(--green-soft)}
.pipe.p-running{border-color:var(--blue);background:var(--blue-soft)}
.pipe.p-blocked{border-color:var(--red);background:var(--red-soft)}
.pipe.p-gray{border-color:var(--line);background:var(--gray-soft)}
@media (max-width:767px){.pipeline{grid-template-columns:repeat(3,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.tab-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search-input{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;background:var(--surface);color:var(--ink);min-width:200px}
select.filter{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.thumb-wrap{display:block;width:100%;padding:0;border:none;background:none;cursor:zoom-in;border-radius:9px}
.thumb-wrap img{display:block;width:100%;height:180px;object-fit:contain;background:var(--surface-2);border-radius:9px}
.thumb-wrap:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.vis-meta{font-size:11.5px;color:var(--ink-2);margin-top:4px;line-height:1.7;overflow-wrap:normal;word-break:normal}
.vis-meta .mono{overflow-wrap:anywhere;word-break:break-all}
.attempt-list td{overflow-wrap:normal;word-break:normal}
.attempt-list td.mono{overflow-wrap:anywhere;word-break:break-all}
.v-attempt-btn{margin-top:8px}
.vis-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);padding:11px;overflow:hidden}
.vis-card .v-title{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis-meta{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.65}
.attempt-list{width:100%;font-size:11.5px;border-collapse:collapse}
.attempt-list td,.attempt-list th{padding:4px 6px;border-bottom:1px solid var(--line)}
.iframe-preview{width:100%;height:430px;border:1px solid var(--line);border-radius:10px;background:#fff}
.preview-empty{border:1px dashed var(--line-strong);border-radius:10px;padding:34px;text-align:center;color:var(--ink-3);font-size:12.5px;background:var(--surface-2);min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.platform-row{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.platform-row:last-child{border-bottom:none}
.platform-name{font-size:13px;font-weight:700;min-width:84px}
.blocker-chip{display:inline-block;border-radius:6px;background:var(--red-soft);color:var(--red);font-size:11px;padding:2px 8px;margin:2px 4px 0 0}
.ok-chip{display:inline-block;border-radius:6px;background:var(--green-soft);color:var(--green);font-size:11px;padding:2px 8px;margin:2px 4px 0 0}
.evidence-list{font-size:12px;line-height:1.8}
.evidence-list a{word-break:break-all}

/* ---- drawer ---- */
.drawer{position:fixed;inset:0;z-index:80}
.drawer-backdrop{position:absolute;inset:0;background:rgba(30,22,12,.45)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(43,36,28,.16);animation:drawer-in .16s ease}
@keyframes drawer-in{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-title{font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);flex:none}
.drawer-close:hover{background:var(--surface-2)}
.drawer-body{padding:16px 18px;overflow:auto;flex:1}
.drawer-body h4{font-size:12.5px;color:var(--ink-3);font-weight:600;margin:14px 0 6px}
.drawer-body h4:first-child{margin-top:0}
.drawer-body .kv{font-size:12.5px;line-height:1.8}
.drawer-body .kv b{color:var(--ink-3);font-weight:600;display:inline-block;min-width:70px}
.drawer-body ul{list-style:none}
.drawer-body ul li{padding:3px 0;font-size:12.5px;line-height:1.7;padding-left:14px;position:relative}
.drawer-body ul li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}

/* ---- lightbox (fixed v1) ---- */
#visual-lightbox .hidden{display:none}
.visual-lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
.visual-lightbox.hidden{display:none}
.visual-lightbox-backdrop{position:absolute;inset:0;background:rgba(20,14,8,.88)}
.visual-lightbox-inner{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:60px 72px 210px}
.visual-lightbox-stage{pointer-events:auto;position:relative;max-width:90vw;max-height:85vh}
.visual-lightbox-img{display:block;max-width:90vw;max-height:85vh;object-fit:contain;cursor:zoom-out;border-radius:6px;background:#1A140C;box-shadow:0 10px 50px rgba(0,0,0,.55)}
.visual-lightbox-close{position:absolute;top:14px;right:16px;z-index:2;pointer-events:auto;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,248,239,.14);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.visual-lightbox-close:hover{background:rgba(232,86,61,.85)}
.visual-lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;pointer-events:auto;width:44px;height:64px;border:none;border-radius:10px;background:rgba(255,248,239,.14);color:#fff;font-size:26px;cursor:pointer}
.visual-lightbox-nav:hover{background:rgba(232,86,61,.85)}
.visual-lightbox-prev{left:14px}.visual-lightbox-next{right:14px}
.visual-lightbox-error{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#FFD9CE;font-size:14px;background:rgba(30,20,12,.9);border-radius:6px}
.visual-lightbox-error.show{display:flex}
.visual-lightbox-error a{pointer-events:auto;color:#fff;margin:0 3px}
.visual-lightbox-info{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:auto;background:rgba(255,248,239,.97);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 14px;max-width:min(620px,92vw);max-height:150px;overflow:auto;font-size:11.5px;line-height:1.6;overflow-wrap:anywhere}
.visual-lb-row{display:flex;gap:8px}
.visual-lb-row b{min-width:88px;color:var(--ink-3);font-weight:600;flex-shrink:0}
.visual-lb-row a{color:var(--orange-strong);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12a7 7 0 0 1 14 0"/><path d="M8.5 12a3.5 3.5 0 0 1 7 0"/><path d="M12 12l-3 9"/><path d="M12 12l3 9"/></svg></div>
      <div><div class="brand-name">SparkOS</div><div class="brand-sub">AI 编辑部 · V2 预览</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-preview-note">只读预览版：仅展示与导航，不执行审批、驳回、重试、交付或发布。</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开导航"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
      <div class="topbar-title" id="topbarTitle"></div>
      <div class="topbar-meta">
        <span class="pill pill-orange">V2 只读预览</span>
        <span class="hide-sm" id="topbarTime"></span>
        <span class="pill pill-gray hide-sm" id="topbarHealth"></span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="详情抽屉">
  <div class="drawer-backdrop" data-drawer-backdrop></div>
  <div class="drawer-panel">
    <div class="drawer-head"><div class="drawer-title" id="drawerTitle"></div><button class="drawer-close" data-drawer-close type="button" aria-label="关闭抽屉">✕</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<div id="visual-lightbox" class="visual-lightbox hidden" role="dialog" aria-modal="true" aria-label="视觉图片大图预览">
  <div class="visual-lightbox-backdrop" data-lightbox-backdrop></div>
  <div class="visual-lightbox-inner">
    <button type="button" class="visual-lightbox-close" data-lightbox-close aria-label="关闭预览">✕</button>
    <button type="button" class="visual-lightbox-nav visual-lightbox-prev" data-lightbox-prev aria-label="上一张（方向键 ←）">‹</button>
    <div class="visual-lightbox-stage" data-lightbox-stage>
      <img class="visual-lightbox-img" data-lightbox-img alt="">
      <div class="visual-lightbox-error hidden" data-lightbox-error role="alert">
        <div data-lightbox-error-msg>图片加载失败</div>
        <div>
          <a class="btn" data-lightbox-anchor data-lightbox-error-link href="#" target="_blank" rel="noopener noreferrer">打开原图</a>
          <a class="btn" data-lightbox-anchor data-lightbox-error-current href="#">在当前标签查看原图</a>
        </div>
      </div>
    </div>

<script>

function fmtISO(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d.getTime()))return esc(iso);var p=function(n){return (n<10?'0':'')+n;};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}

var ICONS={

  db:['M12 3c4 0 7 1.5 7 3.5S16 10 12 10 5 8.5 5 6.5 8 3 12 3z','M5 6.5V12c0 2 3 3.5 7 3.5s7-1.5 7-3.5V6.5','M5 12v5.5C5 19.5 8 21 12 21s7-1.5 7-3.5V12'],

};
function icon(name){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||[]).map(function(d){return '<path d="'+d+'"/>';}).join('')+'</svg>';}
function badge(text,cls){return '<span class="badge '+(cls||'badge-gray')+'">'+esc(text)+'</span>';}
function empty(title,note,ic){return '<div class="empty">'+icon(ic||'doc')+'<div>'+esc(title)+'</div>'+(note?'<div class="empty-note">'+esc(note)+'</div>':'')+'</div>';}
function gradeBadge(g){var m={A:'badge-green',B:'badge-blue',C:'badge-amber',D:'badge-red'};return '<span class="badge '+(m[g]||'badge-gray')+'">'+esc(g)+'</span>';}
function lineName(id){if(!id)return '—';var l=(D.lines||[]).filter(function(x){return x.id===id;})[0];return l?l.name:id;}
function fmtDate(v){if(!v)return '—';var s=String(v);if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);return esc(v);}

/* ============ data boot ============ */
var D = null;
function boot(){
  if(window._embeddedDailyData){D=window._embeddedDailyData;renderRouter();return;}
  // 无内嵌数据：显示加载态并经 GET /sparkos/data 兜底（只读）
  var view=$('view');
  view.innerHTML='<div class="empty">'+icon('clock')+'<div>正在加载工作台数据…</div></div>';
  fetch('/sparkos/data').then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok&&j.value){D=j.value;renderRouter();}
    else{renderFatal('数据端点返回异常：'+(j&&j.error&&j.error.message?j.error.message:'未知错误'));}
  }).catch(function(e){renderFatal('无法读取 /sparkos/data：'+String(e&&e.message||e));});
}
function renderFatal(msg){
  $('view').innerHTML='<div class="card"><div class="card-head"><div class="card-title">'+icon('alert')+'数据不可用</div></div><div class="empty">'+icon('alert')+'<div>'+esc(msg||'工作台数据缺失')+'</div><div class="empty-note">请刷新页面重试；若持续失败，请检查插件服务是否正常，或打开原版工作台 <a href="/sparkos/app">/sparkos/app</a> 对照。</div><div style="margin-top:12px"><button type="button" class="btn btn-ghost" onclick="location.reload()">重新加载</button></div></div></div>';
}

/* ============ router ============ */
var VIEWS=[
  {id:'overview',label:'今日总览',icon:'overview'},
  {id:'intel',label:'情报中心',icon:'intel'},
  {id:'topics',label:'选题策划',icon:'topics'},
  {id:'creation',label:'创作中心',icon:'creation'},
  {id:'review',label:'审核中心',icon:'review'},
  {id:'visual',label:'视觉中心',icon:'visual'},
  {id:'publish',label:'发布准备',icon:'publish'},
  {id:'growth',label:'增长分析',icon:'growth'},
  {id:'system',label:'系统状态',icon:'system'}
];
var state={view:'overview',filters:{review:{type:'all',urgency:'all',time:'all',q:''},intel:{q:''},creation:{packageId:null,platform:'wechat',previewMode:'desktop'}}};
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('?');
  var view=parts[0]||'overview';
  if(!VIEWS.some(function(v){return v.id===view;}))view='overview';
  var params={};
  if(parts[1])parts[1].split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)params[safeDecode(kv.slice(0,i))]=safeDecode(kv.slice(i+1));});
  return {view:view,params:params};
}
function setHashParams(params){
  var r=parseHash();
  var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  history.replaceState(null,'','#/'+r.view+(qs?'?'+qs:''));
}
function navigate(view){
  if(!VIEWS.some(function(v){return v.id===view;}))view='overview';
  if(view===state.view){renderView(view);return;}
  location.hash='#/'+view;
}
window.addEventListener('hashchange',renderRouter);
function renderRouter(){
  var r=parseHash();
  state.view=r.view;
  if(r.params.type)state.filters.review.type=r.params.type;
  if(r.params.urgency)state.filters.review.urgency=r.params.urgency;
  if(r.params.time)state.filters.review.time=r.params.time;
  if(r.params.q!=null)state.filters.review.q=r.params.q;
  if(r.params.pkg)state.filters.creation.packageId=r.params.pkg;
  if(r.params.pf)state.filters.creation.platform=r.params.pf;
  if(r.params.pv)state.filters.creation.previewMode=r.params.pv;
  renderView(r.view);
}
function renderView(view){
  state.view=view;
  var cur=VIEWS.filter(function(v){return v.id===view;})[0];
  $('nav').innerHTML=VIEWS.map(function(v){
    return '<button type="button" class="nav-item'+(v.id===view?' active':'')+'" data-nav="'+v.id+'">'+icon(v.icon)+'<span>'+v.label+'</span></button>';
  }).join('');
  $('topbarTitle').innerHTML=icon(cur.icon)+'<span>'+cur.label+'</span>';
  $('topbarTime').textContent=D&&D.generatedAt?('数据 '+fmtISO(D.generatedAt)):'数据 —';
  var overall=(D&&D.intel&&D.intel.health&&D.intel.health.overall)||'pending';
  var overallName={green:'正常',red:'异常',pending:'待接入'}[overall]||overall;
  $('topbarHealth').textContent='信源 '+overallName;
  $('view').innerHTML=RENDER[view]();
  if(view==='review')applyReviewFilters();
  $('view').scrollTop=0;window.scrollTo(0,0);
}

/* ============ overview ============ */
function renderOverview(){
  var d=D||{};var daily=d.daily||{};var data=daily.data||{};
  var intel=d.intel||{health:{sources:[],overall:'pending'}};
  var health=intel.health||{sources:[],overall:'pending'};var srcs=health.sources||[];
  var fact=d.factory||{};
  var ed=(fact.editorial&&fact.editorial.cards)||[];
  var drafts=(fact.drafts)||[];
  var vis=(fact.visual&&fact.visual.batches)||[];
  var pendingTopics=ed.filter(function(c){return !c.decision||c.decision==='pending';}).length;
  var pendingDrafts=drafts.filter(function(p){return p.status==='waiting_approval';}).length;
  var pendingVisual=0;vis.forEach(function(b){(b.tasks||[]).forEach(function(t){if(t.state==='waiting_visual_approval')pendingVisual++;});});
  var abCount=ed.filter(function(c){return c.verificationGrade==='A'||c.verificationGrade==='B';}).length;
  var blockers=[];vis.forEach(function(b){var bl=(b.readiness&&b.readiness.blockers)||[];blockers=blockers.concat(bl);});
  var greenSrc=srcs.filter(function(s){return s.status==='green';}).length;
  var h=[];
  // hero
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('sun')+'今日总览</div><span class="pill pill-gray">'+esc(daily.date||'日期未知')+'</span></div>');
  var healthName={green:'正常',red:'异常',pending:'待接入'}[health.overall]||health.overall;
  var todoCount=pendingVisual+pendingDrafts+pendingTopics+(d.distillQueue||[]).length+blockers.length;
  h.push('<div style="font-size:13.5px;line-height:1.9">情报源 <b>'+healthName+'</b>（'+greenSrc+'/'+srcs.length+'） · 待审图片 <b>'+pendingVisual+'</b> · 待审草稿 <b>'+pendingDrafts+'</b> · 待审批选题 <b>'+pendingTopics+'</b> · 发布阻塞 <b>'+blockers.length+'</b>'+(todoCount?' · 今日待办 <b style="color:var(--orange-strong)">'+todoCount+'</b> 项':'')+'</div>');
  h.push('</div>');
  // todo
  var todos=[];
  if(pendingVisual)todos.push({sev:0,type:'视觉',cls:'badge-orange',title:pendingVisual+' 张图片待审核',meta:'视觉中心 · 逐个放大查看后审批（V2 只读）',target:'visual'});
  if(pendingDrafts)todos.push({sev:1,type:'创作',cls:'badge-blue',title:pendingDrafts+' 个草稿包待审批',meta:'创作中心 · 平台预览与事实边界（V2 只读）',target:'creation'});
  if(blockers.length)todos.push({sev:2,type:'交付',cls:'badge-red',title:'发布准备存在 '+blockers.length+' 项阻塞',meta:blockers.slice(0,3).join('；')+(blockers.length>3?' 等':''),target:'publish'});
  if(pendingTopics)todos.push({sev:3,type:'选题',cls:'badge-amber',title:pendingTopics+' 张策划卡待审批',meta:'选题策划 · A/B 证据闸门（V2 只读）',target:'topics'});
  if((d.distillQueue||[]).length)todos.push({sev:4,type:'蒸馏',cls:'badge-gray',title:(d.distillQueue||[]).length+' 条蒸馏候选待审',meta:'审核中心 · 四红线由人工执行',target:'review'});
  if((d.writebackQueue||[]).length)todos.push({sev:5,type:'写回',cls:'badge-gray',title:(d.writebackQueue||[]).length+' 条待写回清单',meta:'人工核对后写回星火库（插件不自动写）',target:'review'});
  todos.sort(function(a,b){return a.sev-b.sev;});
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('check')+'今日待办</div>'+(todos.length?'<span class="pill pill-amber">'+todos.length+' 项待处理</span>':'<span class="pill pill-green">已清空</span>')+'</div>');
  if(!todos.length){h.push('<div class="empty">'+icon('check')+'<div>今日无待办事项</div><div class="empty-note">所有审核队列为空、无发布阻塞。</div></div>');}
  else{todos.forEach(function(t){h.push('<div class="todo-row"><span class="badge '+t.cls+'">'+t.type+'</span><div class="todo-main"><div class="todo-title">'+esc(t.title)+'</div><div class="todo-meta">'+esc(t.meta)+'</div></div><button type="button" class="btn btn-ghost" data-goto="'+t.target+'">前往</button></div>');});}
  h.push('</div>');
  // pipeline
  var stages=[
    {name:'情报',detail:srcs.length+' 源',status:srcs.length?(health.overall==='red'?'blocked':health.overall==='green'?'done':'running'):'gray'},
    {name:'核验',detail:fact.ranking?((fact.ranking.top5||[]).length+' 上榜'):'待排名',status:fact.ranking?'done':((d.clusters&&d.clusters.items&&d.clusters.items.length)?'running':'gray')},
    {name:'选题',detail:ed.length+' 卡',status:ed.length?(pendingTopics?'running':'done'):'gray'},
    {name:'创作',detail:drafts.length+' 包',status:drafts.length?(pendingDrafts?'running':(drafts.some(function(p){return p.status==='rejected';})?'blocked':'done')):'gray'},
    {name:'视觉',detail:vis.length+' 批',status:vis.length?(pendingVisual?'running':(vis.some(function(b){return b.status==='rejected';})?'blocked':'done')):'gray'},
    {name:'交付',detail:vis.some(function(b){return b.deliveryLink||(b.readiness&&b.readiness.deliveryReady);})?'就绪':'待定',status:vis.some(function(b){return b.deliveryLink||(b.readiness&&b.readiness.deliveryReady);})?'done':(vis.length?'running':'gray')}
  ];
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('system')+'六阶段生产进度</div></div><div class="pipeline">');
  var stName={done:{l:'已完成',c:'dot-green'},running:{l:'进行中',c:'dot-blue'},blocked:{l:'阻塞',c:'dot-red'},gray:{l:'未开始',c:'dot-gray'}};
  stages.forEach(function(s){var m=stName[s.status]||stName.gray;h.push('<div class="pipe p-'+s.status+'"><span class="dot '+m.c+'"></span><div class="p-name">'+s.name+'</div><div class="p-count">'+esc(s.detail)+' · '+m.l+'</div></div>');});
  h.push('</div></div>');
  // stats
  var stats=[
    {label:'情报源健康',value:healthName,sub:greenSrc+' / '+srcs.length+' 源',ic:'intel'},
    {label:'情报事件',value:d.events||0,sub:'runtime 事件累计',ic:'doc'},
    {label:'A/B 级候选',value:abCount,sub:'编辑策划证据等级',ic:'topics'},
    {label:'待审批选题',value:pendingTopics,sub:'周三/周六策划卡',ic:'topics'},
    {label:'待审草稿',value:pendingDrafts,sub:'工厂草稿包',ic:'creation'},
    {label:'待审图片',value:pendingVisual,sub:'视觉 attempt',ic:'visual'},
    {label:'发布阻塞',value:blockers.length,sub:'视觉 readiness',ic:'publish'}
  ];
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('growth')+'数据总览</div></div><div class="stat-grid">');
  stats.forEach(function(s){h.push('<div class="stat"><div class="stat-label">'+icon(s.ic)+esc(s.label)+'</div><div class="stat-value">'+esc(s.value)+'</div><div class="stat-sub">'+esc(s.sub)+'</div></div>');});
  h.push('</div></div>');
  return h.join('');
}

/* ============ intel ============ */
function renderIntel(){
  var fact=D.factory||{};var r=fact.ranking;
  var h=[];
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('intel')+'每日 Top 5 · 上升榜 · 连续霸榜</div>'+(r?'<span class="pill pill-gray">'+esc(r.date)+'</span>':'')+'</div>');
  if(!r){h.push(empty('暂无排名快照','执行情报簇分析并完成 intel rank 后，此处展示可解释的每日排名。','intel'));}
  else{
    h.push('<table><thead><tr><th>#</th><th>主题</th><th>热度</th><th>增速</th><th>证据</th><th>连榜</th><th>创作闸门</th></tr></thead><tbody>');
    (r.top5||[]).forEach(function(t){
      h.push('<tr class="row-click" data-intel-drawer="'+esc(t.topicKey)+'"><td>'+t.rank+'</td><td><b>'+esc(t.topic)+'</b></td><td>'+t.heatScore.toFixed(1)+'</td><td>'+t.velocityScore.toFixed(1)+'</td><td>'+gradeBadge(t.verificationGrade)+'</td><td>'+t.consecutiveTopDays+' 天</td><td>'+(t.eligibleForCreation?'<span class="badge badge-green">可创作</span>':'<span class="badge badge-gray">待核验</span>')+'</td></tr>');
    });
    h.push('</tbody></table>');
    h.push('<div class="dim" style="margin-top:6px">已展示 '+(r.top5||[]).length+' / 5 个主题 · 点击行查看详情与技术 ID</div>');
    h.push('<div style="margin-top:10px;font-size:12.5px;color:var(--ink-3)">上升最快：'+(((r.rising||[]).slice(0,5).map(function(t){return '<b style="color:var(--ink-2)">'+esc(t.topic)+'</b>（'+t.velocityScore.toFixed(0)+'）';}).join(' · '))||'暂无')+'</div>');
    h.push('<div style="margin-top:8px;font-size:12.5px;color:var(--ink-3)">连续霸榜：'+(((r.persistent||[]).map(function(t){return '<span class="badge badge-orange">'+esc(t.topic)+' · '+t.consecutiveTopDays+' 天</span>';}).join(' '))||'<span class="dim">暂无</span>')+'</div>');
  }
  h.push('</div>');
  var cl=D.clusters||{items:[]};
  h.push('<div class="card"><div class="card-head"><div class="card-title">'+icon('db')+'情报簇（来源 · 事实 · 推断 · 风险）</div>'+(cl.date?'<span class="pill pill-gray">'+esc(cl.date)+'</span>':'')+'</div>');
  if(!cl.items.length){h.push(empty('暂无情报簇','执行 sparkos_run intel analyze 生成骨架，模型分析后 submitCluster 写回。','db'));}
  else{
    cl.items.forEach(function(c){
      h.push('<div class="todo-row"><div class="todo-main"><div class="todo-title">'+esc(c.topic||'(待分析)')+'</div><div class="todo-meta">'+fmtDate(c.date)+' · 来源 '+c.sourceCount+' · 事件 '+(c.eventKeys||[]).length+' · 热度 '+esc(c.heat||'-')+'</div></div><button type="button" class="btn btn-ghost" data-cluster-drawer="'+esc(c.clusterId)+'">详情</button></div>');
    });
  }
  h.push('</div>');
  return h.join('');
}
function openIntelDrawer(topicKey){
  if(!topicKey)return;
  var r=D.factory&&D.factory.ranking;
  var item=null;
  if(r){(r.top5||[]).concat(r.rising||[]).concat(r.persistent||[]).concat(r.all||[]).forEach(function(t){if(t.topicKey===topicKey)item=t;});}
  var cluster=null;
  (D.clusters&&D.clusters.items||[]).forEach(function(c){if(c.clusterId===topicKey||c.topicKey===topicKey)cluster=c;});
  var h=[];
  if(item){
    h.push('<h4>主题</h4><div class="kv"><div><b>主题</b>'+esc(item.topic)+'</div><div><b>证据</b>'+gradeBadge(item.verificationGrade)+'</div><div><b>热度</b>'+item.heatScore.toFixed(1)+' · <b>增速</b>'+item.velocityScore.toFixed(1)+'</div><div><b>提及</b>'+item.mentionCount+' · <b>来源</b>'+item.sourceCount+' · <b>连榜</b>'+item.consecutiveTopDays+' 天</div></div>');
  }
  if(cluster){
    if(cluster.coreFacts&&cluster.coreFacts.length){h.push('<h4>事实</h4><ul>'+cluster.coreFacts.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}
    var j=cluster.judgment;
    if(j){
      if(j.confirmedFacts&&j.confirmedFacts.length){h.push('<h4>已确认事实</h4><ul>'+j.confirmedFacts.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}
      if(j.inferences&&j.inferences.length){h.push('<h4>推断</h4><ul>'+j.inferences.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}
      if(j.editorialView){h.push('<h4>编辑视角</h4><div class="kv">'+esc(j.editorialView)+'</div>');}
      if(j.counterArguments&&j.counterArguments.length){h.push('<h4>反方</h4><ul>'+j.counterArguments.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');}

/* ============ review ============ */
function reviewItems(){
  var items=[];
  var ed=(D.factory&&D.factory.editorial&&D.factory.editorial.cards)||[];
  ed.forEach(function(c){if(c.decision==='approved'||c.decision==='rejected')return;items.push({key:'topic',type:'选题',sev:1,time:null,title:c.title,id:c.id,target:'topics',note:'策划卡 #'+c.rank+' · 证据 '+c.verificationGrade});});
  var drafts=(D.factory&&D.factory.drafts)||[];
  drafts.forEach(function(p){if(p.status!=='waiting_approval')return;items.push({key:'draft',type:'草稿',sev:1,time:p.createdAt,title:p.title||p.id,id:p.id,target:'creation',note:'v'+p.revision+' · '+p.id});});
  var vis=(D.factory&&D.factory.visual&&D.factory.visual.batches)||[];
  vis.forEach(function(b){(b.tasks||[]).forEach(function(t){if(t.state!=='waiting_visual_approval')return;items.push({key:'visual',type:'图片',sev:0,time:null,title:t.assetId,id:t.id,target:'visual',note:b.packageId+' · '+t.placement});});});
  (D.distillQueue||[]).forEach(function(e){items.push({key:'distill',type:'蒸馏',sev:2,time:null,title:e.file,id:e.file,target:'review',note:e.summary});});
  return items;
}
function applyReviewFilters(){
  var f=state.filters.review;
  var items=reviewItems();
  var today=new Date();today.setHours(0,0,0,0);
  var filtered=items.filter(function(it){
    if(f.type!=='all'&&it.key!==f.type)return false;
    if(f.urgency!=='all'){var sev=it.sev===0?'high':it.sev===1?'medium':'low';if(sev!==f.urgency)return false;}
    if(f.time!=='all'){
      if(it.time){var d=new Date(it.time);if(f.time==='today'&&d<today)return false;if(f.time==='older'&&d>=today)return false;}
      else if(f.time==='older')return false;
    }
    if(f.q&&(it.title+' '+it.note).toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
    return true;
  });
  var cls={topic:'badge-amber',draft:'badge-blue',visual:'badge-orange',distill:'badge-gray'};
  var list=$('reviewList');
  if(!list)return;
  if(!filtered.length){list.innerHTML=empty('没有匹配的待审项','调整筛选条件或搜索词后重试。','filter');return;}
  list.innerHTML='<div class="dim" style="margin-bottom:8px">共 '+filtered.length+' 项待处理 · 决策按钮已禁用（V2 只读）</div>'+filtered.map(function(it){
    var sevDot=it.sev===0?'<span class="dot dot-red"></span>':it.sev===1?'<span class="dot dot-amber"></span>':'<span class="dot dot-gray"></span>';
    var gotoAttr=it.key==='visual'?' data-goto-visual="'+esc(it.id)+'"':it.key==='draft'?' data-goto-creation="'+esc(it.id)+'"':it.key==='topic'?' data-goto-topic="'+esc(it.id)+'"':' data-goto="'+it.target+'"';
    return '<div class="todo-row"><span class="badge '+cls[it.key]+'">'+it.type+'</span>'+sevDot+'<div class="todo-main"><div class="todo-title">'+esc(it.title)+'</div><div class="todo-meta">'+esc(it.note)+'</div></div><button type="button" class="btn btn-ghost"'+gotoAttr+'>前往</button></div>';
  }).join('');
}

// blocker 平台归属：按 code 中的平台子串归类；返回 null 表示全局阻塞

/* ============ lightbox（受控 attemptId 端点，只读） ============ */
var visualLightbox={items:[],index:-1,lastFocused:null};
var ATTEMPT_ID_RE=/^va-[a-f0-9]{20}$/;
function visualTaskForAttempt(attemptId){var found=null;(D.factory&&D.factory.visual&&D.factory.visual.batches||[]).some(function(batch){return (batch.tasks||[]).some(function(task){var attempt=currentAttempt(task);if(attempt&&attempt.id===attemptId){found={batch:batch,task:task,attempt:attempt};return true;}return false;});});return found;}
function visualLightboxItems(attemptId){
  if(!ATTEMPT_ID_RE.test(attemptId))return [];
  var found=visualTaskForAttempt(attemptId);
  if(!found)return [];
  return (found.batch.tasks||[]).map(function(t){var a=currentAttempt(t);if(!a||!a.importedRelativePath)return null;return {task:t,attempt:a,attemptId:a.id};}).filter(Boolean);
}
function visualLightboxCurrent(){return visualLightbox.items[visualLightbox.index];}
function visualAssetUrl(attemptId){if(typeof attemptId!=='string'||!ATTEMPT_ID_RE.test(attemptId))return null;return '/sparkos/visual/asset?attemptId='+encodeURIComponent(attemptId);}
function renderVisualLightboxImage(){
  var lb=$('visual-lightbox');
  var item=visualLightboxCurrent();
  if(!lb||!item)return;
  var img=lb.querySelector('[data-lightbox-img]');
  var error=lb.querySelector('[data-lightbox-error]');
  var msg=lb.querySelector('[data-lightbox-error-msg]');
  var link=lb.querySelector('[data-lightbox-error-link]');
  var linkCurrent=lb.querySelector('[data-lightbox-error-current]');
  var url=visualAssetUrl(item.attemptId);
  img.alt=item.task.altText||'';
  img.classList.remove('hidden');
  error.classList.remove('show');
  if(!url){
    msg.textContent='图片加载失败（attemptId 非法：'+item.attemptId+'）';
    img.classList.add('hidden');
    error.classList.add('show');
    return;
  }
  img.src=url;
  link.href=url;
  linkCurrent.href=url;
  img.onerror=function(){
    img.classList.add('hidden');
    msg.textContent='图片加载失败（无法加载视觉资产 '+item.attemptId+'，请用下方链接重试）';
    error.classList.add('show');
  };
}
function renderVisualLightboxInfo(){
  var lb=$('visual-lightbox');
  var item=visualLightboxCurrent();
  if(!lb||!item)return;
  var a=item.attempt,t=item.task;
  var sha=a.importedSha256?esc(String(a.importedSha256).slice(0,12)):'—';
  var rows=[
    ['assetId',esc(t.assetId)],
    ['attempt 编号',esc(String(a.attemptNo))],
    ['provider/model',esc((a.provider||'—')+' / '+(a.model||'—'))],
    ['尺寸',esc(dimsOf(a))],
    ['MIME',esc(a.sourceMediaType||'—')],
    ['bytes',esc(String(a.sourceBytes==null?0:a.sourceBytes))],
    ['SHA',sha],
    ['altText',esc(t.altText)],
    ['placement',esc(t.placement)],
    ['prompt',esc(t.prompt)]
  ].map(function(r){return '<div class="visual-lb-row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';}).join('');
  var indexLabel='<div class="visual-lb-row"><b>图片</b><span>'+(visualLightbox.index+1)+' / '+visualLightbox.items.length+'</span></div>';
  var url=visualAssetUrl(a.id);
  var openLink=url?'<div class="visual-lb-row"><b>原图</b><a data-lightbox-anchor data-lightbox-open href="'+url+'" target="_blank" rel="noopener noreferrer">打开原图</a> <a data-lightbox-anchor data-lightbox-open-current href="'+url+'">在当前标签查看原图</a></div>':'';
  lb.querySelector('[data-lightbox-info]').innerHTML=indexLabel+rows+openLink;
}
function openVisualLightbox(attemptId,trigger){
  if(!ATTEMPT_ID_RE.test(attemptId))return;
  var items=visualLightboxItems(attemptId);
  if(!items.length)return;
  var index=-1;
  for(var i=0;i<items.length;i++){if(items[i].attemptId===attemptId){index=i;break;}}
  if(index<0)return;
  visualLightbox.items=items;visualLightbox.index=index;visualLightbox.lastFocused=trigger||document.activeElement;
  var lb=$('visual-lightbox');
  lb.classList.remove('hidden');
  document.body.classList.add('modal-open');
  renderVisualLightboxImage();
  renderVisualLightboxInfo();
  var close=lb.querySelector('[data-lightbox-close]');
  if(close)close.focus();
}
function closeVisualLightbox(){
  if(visualLightbox.index<0)return;
  var lb=$('visual-lightbox');
  lb.classList.add('hidden');
  document.body.classList.remove('modal-open');
  var img=lb.querySelector('[data-lightbox-img]');
  if(img)img.removeAttribute('src');
  var last=visualLightbox.lastFocused;
  visualLightbox.items=[];visualLightbox.index=-1;visualLightbox.lastFocused=null;
  if(last&&typeof last.focus==='function')last.focus();
}
function stepVisualLightbox(delta){
  var count=visualLightbox.items.length;
  if(!count||visualLightbox.index<0)return;
  visualLightbox.index=(visualLightbox.index+delta+count)%count;
  renderVisualLightboxImage();
  renderVisualLightboxInfo();
}

    var pkg=t.closest('[data-pkg]');if(pkg){state.filters.creation.packageId=pkg.getAttribute('data-pkg');setHashParams({pkg:state.filters.creation.packageId});renderView('creation');return;}
    var pf=t.closest('[data-pf]');if(pf){state.filters.creation.platform=pf.getAttribute('data-pf');setHashParams({pf:state.filters.creation.platform});renderView('creation');return;}
    var pv=t.closest('[data-pv]');if(pv){state.filters.creation.previewMode=pv.getAttribute('data-pv');setHashParams({pv:state.filters.creation.previewMode});renderView('creation');return;}
    var idr=t.closest('[data-intel-drawer]');if(idr){openIntelDrawer(idr.getAttribute('data-intel-drawer'));return;}
    var cdr=t.closest('[data-cluster-drawer]');if(cdr){openClusterDrawer(cdr.getAttribute('data-cluster-drawer'));return;}
    var tdr=t.closest('[data-topic-drawer]');if(tdr){openTopicDrawer(tdr.getAttribute('data-topic-drawer'));return;}
    var vt=t.closest('[data-visual-thumb]');if(vt){openVisualLightbox(vt.getAttribute('data-visual-thumb'),vt);return;}
    var ah=t.closest('[data-attempt-history]');if(ah){openVisualAttemptDrawer(ah.getAttribute('data-attempt-history'));return;}
    // 审核中心精确导航：前往具体对象
    var gv=t.closest('[data-goto-visual]');if(gv){navigate('visual');setTimeout(function(){var card=document.querySelector('[data-vis-task="'+gv.getAttribute('data-goto-visual')+'"]');if(card){card.scrollIntoView({block:'center'});card.style.outline='2px solid var(--orange)';setTimeout(function(){card.style.outline='';},1600);}},80);return;}
    var gc=t.closest('[data-goto-creation]');if(gc){state.filters.creation.packageId=gc.getAttribute('data-goto-creation');navigate('creation');setTimeout(function(){setHashParams({pkg:state.filters.creation.packageId});},80);return;}
    var gt=t.closest('[data-goto-topic]');if(gt){navigate('topics');setTimeout(function(){var card=document.querySelector('[data-topic-drawer="'+gt.getAttribute('data-goto-topic')+'"]');if(card){card.scrollIntoView({block:'center'});card.style.outline='2px solid var(--orange)';setTimeout(function(){card.style.outline='';},1600);}},80);return;}
  });
  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(!t)return;
    if(t.getAttribute&&t.getAttribute('data-rf')==='type'){state.filters.review.type=t.value;setHashParams({type:t.value});applyReviewFilters();return;}
    if(t.getAttribute&&t.getAttribute('data-rf')==='urgency'){state.filters.review.urgency=t.value;setHashParams({urgency:t.value});applyReviewFilters();return;}
    if(t.getAttribute&&t.getAttribute('data-rf')==='time'){state.filters.review.time=t.value;setHashParams({time:t.value});applyReviewFilters();return;}
  });
  document.addEventListener('input',function(ev){
    var t=ev.target;
    if(!t||!t.getAttribute)return;
    if(t.getAttribute('data-rf')==='q'){state.filters.review.q=t.value;setHashParams({q:t.value});applyReviewFilters();}
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){
      if(visualLightbox.index>=0){ev.preventDefault();closeVisualLightbox();return;}
      if(drawer.open){ev.preventDefault();closeDrawer();return;}
    }
    if(visualLightbox.index>=0){
      if(ev.key==='ArrowLeft'){ev.preventDefault();stepVisualLightbox(-1);return;}
      if(ev.key==='ArrowRight'){ev.preventDefault();stepVisualLightbox(1);}
    }
  });
  boot();
})();

</script>
</body>
</html>
